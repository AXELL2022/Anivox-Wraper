<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shikimori</title>
  <link rel="stylesheet" href="shikimori.css">
  <script src="shikimori.js" defer></script>
</head>
<body>
  <section role="dialog" aria-modal="true" aria-label="Shikimori">
    <nav aria-label="Управление Shikimori">
      <button data-action="back" title="Назад" aria-label="Назад">‹</button>
      <button data-action="forward" title="Вперёд" aria-label="Вперёд">›</button>
      <button data-action="reload" title="Обновить Shikimori" aria-label="Обновить Shikimori">↻</button>
      <strong>Shikimori</strong>
      <span id="status" role="status"></span>
      <button data-action="close" class="close" title="Вернуться к Anivox (Esc)">✕ Закрыть</button>
    </nav>
    <div class="page" aria-hidden="true"></div>
  </section>
</body>
</html>
