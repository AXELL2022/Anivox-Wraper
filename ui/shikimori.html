<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shikimori</title>
  <link rel="stylesheet" href="shikimori.css">
  <script src="shikimori.js" defer></script>
</head>
<body>
  <section role="dialog" aria-modal="true" aria-label="Shikimori">
    <nav aria-label="Управление Shikimori">
      <button data-action="back" title="Назад" aria-label="Назад"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg></button>
      <button data-action="forward" title="Вперёд" aria-label="Вперёд"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg></button>
      <button data-action="reload" title="Обновить Shikimori" aria-label="Обновить Shikimori"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 7l-3-3"/></svg></button>
      <strong>Shikimori</strong>
      <span id="status" role="status"></span>
      <button data-action="close" class="close" title="Вернуться к Anivox (Esc)"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Закрыть</span></button>
    </nav>
    <div class="page" aria-hidden="true"></div>
  </section>
</body>
</html>
