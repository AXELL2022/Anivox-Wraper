<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Загрузка Anivox</title>
  <link rel="stylesheet" href="site-recovery.css">
  <script src="site-recovery.js" defer></script>
</head>
<body>
  <main class="recovery" aria-labelledby="title">
    <div class="brand" aria-label="Anivox"><span class="brand-mark" aria-hidden="true">A</span> ANIVOX</div>
    <section class="card">
      <div class="visual" aria-hidden="true"><span id="spinner" class="spinner"></span><span class="visual-core">A</span></div>
      <div id="status" role="status" aria-live="polite" aria-atomic="true">
        <p class="eyebrow">ВАШ МИР АНИМЕ</p>
        <h1 id="title">Загрузка Anivox…</h1>
        <p id="description" class="description">Подключаемся к сайту. Это может занять немного времени.</p>
        <p id="detail" class="detail" hidden></p>
      </div>
      <div class="actions" aria-label="Восстановление загрузки">
        <button id="retry" class="primary" type="button">Повторить загрузку</button>
        <button id="home" type="button">На главную</button>
        <button id="wait" class="quiet" type="button">Продолжить ожидание</button>
      </div>
      <p id="action-error" class="action-error" role="alert" hidden></p>
    </section>
    <p class="footnote">Anivox Desktop <span aria-hidden="true">·</span> Немного терпения — и можно смотреть</p>
  </main>
</body>
</html>
