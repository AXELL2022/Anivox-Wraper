<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anivox — панель</title>
  <link rel="stylesheet" href="toolbar.css">
  <script src="toolbar.js" defer></script>
</head>
<body>
  <nav aria-label="Управление Anivox">
  <button data-action="back" class="icon" title="Назад" aria-label="Назад"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg></button>
  <button data-action="forward" class="icon" title="Вперёд" aria-label="Вперёд"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg></button>
  <button data-action="reload" class="icon" title="Обновить сайт" aria-label="Обновить сайт"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 7l-3-3"/></svg></button>
  <span class="divider" aria-hidden="true"></span>
  <button id="mpv" title="Открыть текущее видео в MPV (M / Ь)"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 11 7-11 7z"/></svg><span id="mpv-label">MPV</span></button>
  <button id="shikimori" aria-pressed="false" title="Открыть Shikimori поверх сайта"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6C9 4 5 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-2-1-6-1-9 1zm0 0v14"/></svg><span class="button-label">Shikimori</span></button>
  <button id="updater" class="updater-btn" style="display: none;" title="Доступно обновление"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span id="updater-label">Обновление</span></button>
  <span id="status" role="status" aria-live="polite"></span>
  <span class="brand">v0.4.0</span>
  <button id="connection" class="icon" title="Проверить соединение: интернет или сайт" aria-label="Проверить соединение"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".6"/></svg></button>
  <button id="settings" class="icon" title="Настройки Anivox" aria-label="Настройки Anivox"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 3-1 3-3 1-3 3 2 2-1 4 3 1 2 4h5l1-3 3-1 3-3-2-2 1-4-3-1-2-4z"/><circle cx="12" cy="12" r="3"/></svg></button>
</nav>
</body>
</html>
