default = { description = "Permissions for checking and reviewing updates", permissions = ["allow-check-update", "allow-update-review"] }

[[permission]]
identifier = "allow-update-review"
description = "Open the local release notes window"
commands.allow = ["open_update_review"]

[[permission]]
identifier = "allow-check-update"
description = "Enables checking for application updates"
commands.allow = ["check_update"]

[[permission]]
identifier = "allow-install-update"
description = "Enables downloading and installing updates"
commands.allow = ["install_update"]
