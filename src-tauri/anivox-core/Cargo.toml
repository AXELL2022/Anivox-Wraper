[package]
name = "anivox-core"
version = "0.5.1"
description = "Anivox platform-independent core: MPV, Discord presence, settings, history"
authors = ["yasin"]
edition = "2021"

[features]
default = ["net"]
# MPV IPC (tokio), the native shells' site dispatcher, Shikimori/update/speed clients (reqwest). The macOS shell does not need them.
net = ["dep:tokio", "dep:reqwest", "dep:rustls"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.2"
discord-rich-presence = "0.2.4"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "time", "sync", "macros", "rt", "rt-multi-thread"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
