[package]
name = "anivox"
version = "0.5.1"
description = "Anivox Desktop (minimal macOS build)"
authors = ["yasin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["anivox-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Stays unconditional: tauri-build requires it on every platform.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The application itself (macos.rs) is compiled only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
anivox-core = { path = "anivox-core", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.13.1"
discord-rich-presence = "0.2.4"
