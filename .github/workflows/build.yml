name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libdbus-1-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/toolbar.test.mjs

      - name: Build Tauri application
        run: bun run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Arch Linux package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm archlinux-keyring
            pacman -S --noconfirm --needed fakeroot binutils
            useradd -m builder
            chown -R builder:builder /workspace
            su -s /bin/bash builder -c "cd /workspace && PKGDEST=/workspace makepkg -e -f --nodeps --noconfirm"
            chmod -R a+rw /workspace
            ls -la /workspace/*.pkg.tar.zst
          '

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/anivox.exe
          if-no-files-found: warn

      - name: Upload Arch Linux Package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-arch
          path: "*.pkg.tar.zst"
          if-no-files-found: error

      - name: Upload Linux Artifacts (AppImage, deb, binary)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-linux
          path: |
            *.pkg.tar.zst
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/anivox
          if-no-files-found: warn

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            *.pkg.tar.zst
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/anivox.exe
            src-tauri/target/release/anivox
            src-tauri/target/release/bundle/**/latest.json
            src-tauri/target/release/bundle/**/*.tar.gz*
            src-tauri/target/release/bundle/**/*.zip*
            src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

