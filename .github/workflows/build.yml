name: Build

# Windows (WinUI 3) and Linux (GTK) builds on the self-hosted Windows runner;
# GTK is built inside its WSL distribution. No release is published yet: the
# native shells are still being tested. The Tauri Windows/Linux build was
# retired; Tauri remains only for macOS (macos-minimal.yml).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # WSL distribution with Rust, gtk4, webkitgtk-6.0 and pkgconf installed.
  WSL_DISTRO: cachyos

jobs:
  build:
    name: Build (WinUI + GTK)
    # Node.js 24 actions require self-hosted Actions Runner >= 2.327.1.
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Add Cargo to PATH
        run: (Join-Path $env:USERPROFILE '.cargo\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The runner machine has the .NET 10 SDK; setup-dotnet would install into Program Files.
      - name: Check .NET SDK
        run: |
          $version = dotnet --version
          if ($LASTEXITCODE -or -not $version.StartsWith('10.')) { throw ".NET 10 SDK is required, found '$version'" }

      - name: Run JS tests
        run: node --test tests/*.test.mjs

      - name: Check Rust formatting
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path windows-winui/native/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path linux-gtk/Cargo.toml -- --check

      - name: Test the shared core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p anivox-core

      - name: Test the WinUI native core
        run: cargo test --locked --manifest-path windows-winui/native/Cargo.toml

      # dotnet publish + NSIS (makensis on PATH, in Program Files or the Tauri bundler cache).
      - name: Build WinUI installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-winui/installer/build-installer.ps1

      - name: Build and test GTK shell in WSL
        run: |
          # wsl drops backslashes from arguments; wslpath accepts forward slashes.
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $repo = "$(wsl -d $env:WSL_DISTRO -- wslpath -a $workspace)".Trim()
          if ($LASTEXITCODE -or -not $repo) { throw "WSL distribution '$env:WSL_DISTRO' is not available" }
          # Keep the target inside the Linux file system: building on /mnt is several times slower.
          $script = "set -e; cd '$repo'; export CARGO_TARGET_DIR=`$HOME/.cache/anivox-gtk-ci; " +
            "cargo build --locked --manifest-path linux-gtk/Cargo.toml; " +
            "cargo test --locked --manifest-path linux-gtk/Cargo.toml"
          wsl -d $env:WSL_DISTRO -- bash -lc $script
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload WinUI installer
        uses: actions/upload-artifact@v4
        with:
          name: anivox-winui
          path: windows-winui/installer/out/*_x64-setup.exe
          if-no-files-found: error
