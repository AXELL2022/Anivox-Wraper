name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish (for example v0.3.0)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, X64]
            platform: windows
            shell: powershell
          - os: ubuntu-22.04
            platform: linux
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Windows runner tools
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
          $gitBin = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) {
            throw 'Git Bash is required by the Rust toolchain action'
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:USERPROFILE '.cargo\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup isolated Bun on Windows
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-ci-bun.ps1

      - name: Setup Bun on Linux
        if: matrix.platform == 'linux'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure persistent Windows Rust builds
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-ci-rust.ps1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        if: matrix.platform == 'linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Windows retains its full local target; do not prune it for upload.
          cache-bin: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libdbus-1-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: bun run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare isolated Windows native-test executable
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-native-ci.ps1

      - name: Verify Windows window and taskbar icons
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_taskbar_icon.ps1 -Exe "$env:ANIVOX_NATIVE_TEST_EXE"

      - name: Verify Windows single instance and visibility restoration
        if: matrix.platform == 'windows'
        # Windows may refuse foreground activation from a background runner on
        # the developer's shared desktop. Keep strict focus checks for local runs.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_single_instance.ps1 -Exe "$env:ANIVOX_NATIVE_TEST_EXE" -SkipForegroundCheck

      - name: Build Arch Linux package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed fakeroot binutils debugedit
            useradd -m builder
            chown -R builder:builder /workspace
            su -s /bin/bash builder -c "cd /workspace && PKGDEST=/workspace makepkg -e -f --nodeps --noconfirm"
            chmod -R a+rw /workspace
            ls -la /workspace/*.pkg.tar.zst
          '

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-windows
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe.sig
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.zip*
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi.sig
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.zip*
            ${{ env.CARGO_TARGET_DIR }}/release/anivox.exe
          if-no-files-found: warn

      - name: Upload Arch Linux Package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-arch
          path: "*.pkg.tar.zst"
          if-no-files-found: error

      - name: Upload Linux Artifacts (AppImage, deb, binary)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/anivox
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs --extract-notes

      - name: Generate updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO_NAME: ${{ github.repository }}

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

