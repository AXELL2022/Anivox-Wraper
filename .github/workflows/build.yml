name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish (for example v0.3.0)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, X64]
            platform: windows
            shell: powershell
          - os: ubuntu-22.04
            platform: linux
            shell: bash

    # Node.js 24 actions require self-hosted Actions Runner >= 2.327.1.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Windows runner tools
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
          $gitBin = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) {
            throw 'Git Bash is required by the Rust toolchain action'
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:USERPROFILE '.cargo\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup isolated Bun on Windows
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-ci-bun.ps1

      - name: Setup Bun on Linux
        if: matrix.platform == 'linux'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure persistent Windows Rust builds
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-ci-rust.ps1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        if: matrix.platform == 'linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Windows retains its full local target; do not prune it for upload.
          cache-bin: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libdbus-1-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # Windows ships only the NSIS setup.exe and the MSI (see bundle.targets).
      - name: Build Tauri application (Windows installers)
        if: matrix.platform == 'windows'
        run: bun run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Linux ships only the Arch package, which packs the plain binary: no AppImage/deb/rpm.
      - name: Build Tauri application (Linux binary)
        if: matrix.platform == 'linux'
        run: bun run tauri build --no-bundle

      - name: Prepare isolated Windows native-test executable
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-native-ci.ps1

      - name: Verify Windows window and taskbar icons
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_taskbar_icon.ps1 -Exe "$env:ANIVOX_NATIVE_TEST_EXE"

      - name: Verify Windows single instance and visibility restoration
        if: matrix.platform == 'windows'
        # Windows may refuse foreground activation from a background runner on
        # the developer's shared desktop. Keep strict focus checks for local runs.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_single_instance.ps1 -Exe "$env:ANIVOX_NATIVE_TEST_EXE" -SkipForegroundCheck

      - name: Build Arch Linux package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed fakeroot binutils debugedit
            useradd -m builder
            chown -R builder:builder /workspace
            su -s /bin/bash builder -c "cd /workspace && PKGDEST=/workspace makepkg -e -f --nodeps --noconfirm"
            chmod -R a+rw /workspace
            ls -la /workspace/*.pkg.tar.zst
          '

      # The updater manifest needs a signature for the Linux entry; the app only opens the release page there.
      - name: Sign Arch Linux package
        if: matrix.platform == 'linux'
        run: |
          for package in *.pkg.tar.zst; do
            bun run tauri signer sign "$package"
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: anivox-windows
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*-setup.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*-setup.exe.sig
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

      - name: Upload Arch Linux Package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: anivox-arch
          path: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
          if-no-files-found: error

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-14
    # The macOS app is experimental and not yet verified on a real Mac: a failure
    # here must not block the Windows/Linux release. Remove once it is validated.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Check and test macOS Rust code
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Apple signing is ad-hoc (no Developer ID, no notarization); the updater
      # archive is signed with the repository's Tauri key.
      - name: Build app, DMG and signed updater archive
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'

      # Tauri names the updater archive Anivox.app.tar.gz for every target;
      # give each architecture a distinct name so release assets do not collide.
      - name: Name updater archive per architecture
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          version=$(node -p "require('./package.json').version")
          mv "$bundle/Anivox.app.tar.gz" "$bundle/Anivox_${version}_${{ matrix.arch }}.app.tar.gz"
          mv "$bundle/Anivox.app.tar.gz.sig" "$bundle/Anivox_${version}_${{ matrix.arch }}.app.tar.gz.sig"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: anivox-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [build, build-macos]
    # Pin the publishing environment; do not follow ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs --extract-notes

      - name: Generate updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO_NAME: ${{ github.repository }}

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

