name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, X64]
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libdbus-1-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: bun run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Windows window and taskbar icons
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_taskbar_icon.ps1 -Exe src-tauri/target/release/anivox.exe

      - name: Verify Windows single instance and window restoration
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_single_instance.ps1 -Exe src-tauri/target/release/anivox.exe

      - name: Build Arch Linux package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace archlinux:latest bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed fakeroot binutils debugedit
            useradd -m builder
            chown -R builder:builder /workspace
            su -s /bin/bash builder -c "cd /workspace && PKGDEST=/workspace makepkg -e -f --nodeps --noconfirm"
            chmod -R a+rw /workspace
            ls -la /workspace/*.pkg.tar.zst
          '

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.zip*
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/*.zip*
            src-tauri/target/release/anivox.exe
          if-no-files-found: warn

      - name: Upload Arch Linux Package (.pkg.tar.zst)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-arch
          path: "*.pkg.tar.zst"
          if-no-files-found: error

      - name: Upload Linux Artifacts (AppImage, deb, binary)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: anivox-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/anivox
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs --extract-notes

      - name: Generate updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

