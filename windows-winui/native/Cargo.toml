[package]
name = "anivox-ffi"
version = "0.5.1"
description = "Anivox core for the WinUI 3 shell: C ABI over anivox-core (site IPC, MPV, Discord, session)"
edition = "2021"
publish = false

# Standalone like linux-gtk: not part of the Tauri workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anivox-core = { path = "../../src-tauri/anivox-core", features = ["net"] }
# TLS backend for the core HTTP clients (the core picks the ring provider).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
